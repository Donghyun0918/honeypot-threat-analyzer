# [AWS 서버] T-Pot 원본(~/tpotce, HIVE 24.04.1) 위에 우리 수정분을 얹는 덮어쓰기 파일.
#
# tpot.service 가 이 파일을 같이 쓴다(systemd drop-in, infra/terraform/user_data.sh.tftpl):
#   docker compose -f ~/tpotce/docker-compose.yml -f <저장소>/tpotce/compose/aws_overlay.yml up
#
# sidecars_overlay.yml 과 같은 수정이되 ml-classifier · llm-analyzer 는 뺐다 — 그 둘은
# 대시보드 스택(docker-compose.tpot.yml)이 돌린다. 같은 것을 두 번 띄우면 같은 문서를 두 번 분류한다.
#
# 이 파일은 ~/tpotce 프로젝트에 붙으므로 상대 경로는 ~/tpotce 기준이 된다. 저장소 쪽 파일은
# ~/tpotce/.env 의 JSP_DIR(저장소 체크아웃 경로)로 가리킨다.

services:
  # 처음 기동할 때 Kibana 에 올리는 저장 객체를 한국어판으로 바꾼다.
  # tpotinit 은 첫 기동(myFIRSTRUN)에만 올리므로, 이미 깔린 T-Pot 에는 영향이 없다.
  tpotinit:
    volumes:
      - ${JSP_DIR}/tpotce/docker/tpotinit/dist/etc/objects/kibana_export_ko.ndjson:/opt/tpot/etc/objects/kibana_export.ndjson:ro

  # 원본 conf + /threat-console/ 라우트, 한국어 메인 페이지.
  nginx:
    volumes:
      - ${JSP_DIR}/tpotce/docker/nginx/dist/conf/tpotweb.conf:/etc/nginx/conf.d/tpotweb.conf:ro
      - ${JSP_DIR}/tpotce/docker/nginx/dist/html/index.html:/var/lib/nginx/html/index.html:ro

  # map_web 은 덮어쓰지 않는다. 지금 받는 map:24.04.1(Attack Map Server 4.0.0)은 CARTO 타일을
  # 쓰지 않고, index.html 이 map.js 를 SRI(integrity 해시)로 불러온다. 예전 OSM 타일 패치
  # (tpotce/docker/map-override/map.js)를 얹으면 해시가 안 맞아 브라우저가 map.js 를 실행하지
  # 않고 → WebSocket 을 열지 않아 어택맵이 Disconnected 로 남는다.

  threat-console:
    container_name: threat-console
    restart: always
    build:
      context: ${JSP_DIR}/tpotce/docker
      dockerfile: threat-console/Dockerfile
    image: tpot/threat-console:local
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nginx_local
    environment:
      - ES_HOST=http://elasticsearch:9200
      - REPORT_DIR=/data/threat-console/reports
      - TRAIN_DIR=/data/threat-console/training
      - MODEL_ACTIVE_DIR=/data/ml-classifier/models
      - LISTEN_PORT=8080
    tmpfs:
      - /tmp
    volumes:
      - ${TPOT_DATA_PATH}/threat-console:/data/threat-console
      # 대시보드 스택의 분류기와 같은 모델 디렉토리 — BYOM 으로 올린 모델을 분류기가 바로 읽는다.
      - ${JSP_DIR}/tpotce/data/ml-classifier/models:/data/ml-classifier/models
